[package]
name = "g2n"
version = "0.1.0"
edition = "2024"
description = "Upload Google Drive images to Notion using each file's description as the prompt"

[dependencies]
anyhow = "1"
async-trait = "0.1"
backon = { version = "1.6", features = ["tokio-sleep"] }
indicatif = "0.17"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.6", features = ["derive"] }
directories = "6"
futures-util = "0.3"
mime_guess = "2"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "multipart", "stream", "charset", "query", "form"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "fs", "time", "sync"] }
toml = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"

assert_cmd = "2"
predicates = "3"
wiremock = "0.6"
